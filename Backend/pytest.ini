[pytest]
# Run from the Backend/ directory:  pytest
#
# pythonpath puts Backend/ on sys.path so tests can `from Pipeline import ner`
# without any __init__.py juggling or sys.path hacks inside the test files.
# Requires pytest >= 7.0.
pythonpath = .
testpaths = Tests

# Default collection already picks up both test_*.py and *_test.py, so
# Tests/ner_test.py is found as-is. Stated explicitly so the convention is
# visible rather than folklore.
python_files = test_*.py *_test.py

# -q      : one character per test instead of a line
# --strict-markers : a typo'd @pytest.mark.foo becomes an error, not a silent no-op
addopts = -q --strict-markers

markers =
    slow: touches the network or a model; excluded from the fast suite
